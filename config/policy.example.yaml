version: 1
policy_id: local-default
mode: policy

auto_write:
  max_bytes: 1048576
  max_files_per_minute: 60
  max_bytes_per_minute: 8388608

filesystem:
  - path: "D:\\Projects\\vor-commander\\state\\local\\m1-canary"
    read: auto
    write: approval
  - path: "D:\\Proyectos"
    read: auto
    write: auto
  - path: "D:\\"
    read: auto
    write: approval
  - path: "C:\\Users\\ExampleUser"
    read: approval
    write: approval
  - path: "C:\\Windows"
    read: approval
    write: elevated_approval

terminal:
  default: approval
  inline_eval: elevated_approval
  project_tests: auto
  destructive: approval
  elevated: approval

process:
  list: auto
  inspect: auto
  terminate: approval

browser:
  authenticated_session_use: approval
  secret_extraction: deny
  publish: approval
  purchase: deny

desktop:
  enabled: false

network:
  public_listener_fallback: deny
  transports:
    lan_grpc: 10
    tailscale_grpc: 20
    cloudflare_wss: 30
    relay_wss: 40

audit:
  required: true
  fail_if_unwritable: true
