version: 1
policy_id: local-pilot-example

filesystem:
  - path: "C:\\Users\\YOUR_NAME\\Documents"
    read: auto
    write: approval

terminal:
  default: approval
  inline_eval: elevated_approval
  project_tests: approval
  destructive: deny
  elevated: deny
  # `mode: strict` disables this list. Only canonical absolute executables in
  # this allowlist qualify; PATH is never trusted for unsigned execution.
  safe_executable_paths:
    - "C:\\Program Files\\Git\\cmd\\git.exe"
  # Adding project test/build commands is equivalent to authorizing arbitrary
  # project-controlled code (build.rs, package scripts, conftest/plugins, etc.).
  safe_commands:
    - executable: git
      arguments: [status]

process:
  list: auto
  inspect: auto
  terminate: approval

browser:
  authenticated_session_use: deny
  secret_extraction: deny
  publish: deny
  purchase: deny

desktop:
  enabled: false

network:
  public_listener_fallback: deny

audit:
  required: true
  fail_if_unwritable: true
