name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows, Rust 1.96.0)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: python -m pip install pytest

      - name: Install Rust 1.96.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          cache: false
          # La accion pone RUSTFLAGS=-D warnings por defecto; el CI mide lo mismo que en local.
          # Endurecer a -D warnings es una decision aparte (hoy no se ha medido).
          rustflags: ""

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build release workspace
        run: cargo build --release --workspace --locked

      - name: Check vor-approver release interface
        run: powershell.exe -NoProfile -File tests/check_vor_approver_release.ps1

      - name: Run workspace tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Run Python tests
        run: python -m pytest tests/

      # Los casos de inyeccion de fallos de M4 (C21-C24) solo existen con esta feature;
      # sin este paso nadie los ejecutaria.
      - name: Run M4 fault-injection tests
        run: |
          cargo test -p vor-audit --features fault-injection --locked --no-fail-fast
          cargo test -p vor-dispatch --features fault-injection --locked --no-fail-fast
          cargo test -p vor-core --features fault-injection --locked --no-fail-fast
